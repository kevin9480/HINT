<style>
/* Layout: mobile-first field console. Sticky top bar, bottom tab bar, single column on phones,
   two columns (checklist | decision) on wide screens. Touch targets 48px+ for gloved hands. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #dfe5ea;
  --ink: #131f2a;
  --ink-2: #4a5b69;
  --line: #c9d2da;
  --accent: #0a58b0;
  --accent-ink: #ffffff;
  --crit: #c4301c;
  --warn: #a66a00;
  --ok: #1b7a4b;
  --hl: #ffcf33;
  --hl-ink: #1a1400;
  --font-display: 'Barlow Condensed', 'Noto Sans KR', 'Arial Narrow', sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --surface: #151f29; --surface-2: #1e2b37; --ink: #e8eef3; --ink-2: #9db0bf;
    --line: #2b3a48; --accent: #62a6ff; --accent-ink: #06121f; --crit: #ff7b64; --warn: #f0b44c; --ok: #4cc38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --surface: #151f29; --surface-2: #1e2b37; --ink: #e8eef3; --ink-2: #9db0bf;
  --line: #2b3a48; --accent: #62a6ff; --accent-ink: #06121f; --crit: #ff7b64; --warn: #f0b44c; --ok: #4cc38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-bottom: 96px; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-weight: 500; letter-spacing: .01em; }
.tnum { font-variant-numeric: tabular-nums; }
.svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--hl); display: grid; place-items: center; }
.brand-mark .svg { width: 20px; height: 20px; stroke-width: 2.2; }
.bar .grow { flex: 1; }
.crumb { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 44px; }

main { max-width: 1040px; margin: 0 auto; padding-block: 20px 8px; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.h-page { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 7vw, 44px); line-height: 1.1; letter-spacing: .01em; }
.lead { color: var(--ink-2); max-width: 56ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sub { font-size: 13px; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 880px) { .cols { grid-template-columns: 1fr 1fr; } .cols.wide-left { grid-template-columns: 1.1fr .9fr; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 18px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 160px; }

/* inputs */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); min-width: 0; }
.in, textarea.in { min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; font-weight: 500; }
textarea.in { min-height: 120px; resize: vertical; line-height: 1.55; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.in.mono { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
.err { color: var(--crit); font-size: 13px; font-weight: 500; min-height: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; line-height: 1.7; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, var(--surface)); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.chip.plain { color: var(--ink-2); background: transparent; }
.chip.plain::before { display: none; }

/* scan card */
.scan-actions { display: grid; gap: 10px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cam { position: relative; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 4/3; max-width: 100%; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.reticle { position: absolute; inset: 18% 18%; border: 2px solid var(--hl); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
.cam .btn { position: absolute; right: 10px; bottom: 10px; min-height: 40px; }

/* equipment list */
.eq-list { display: flex; flex-direction: column; }
.eq-item { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; min-height: 64px; }
.eq-item:first-child { border-top: 0; }
.eq-item:hover { background: var(--bg); }
.eq-id { font-family: var(--font-mono); font-weight: 600; font-size: 13px; color: var(--ink-2); }
.eq-name { font-weight: 700; }
.eq-meta { grid-column: 2; font-size: 13px; color: var(--ink-2); }
.eq-item .chip { grid-row: 1 / span 2; grid-column: 3; }
.eq-item .eq-id { grid-column: 1; grid-row: 1 / span 2; min-width: 84px; }

/* status banner */
.banner { border: 1px solid var(--crit); border-radius: 8px; overflow: hidden; background: color-mix(in srgb, var(--crit) 8%, var(--surface)); }
.banner.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.hazard { height: 8px; background: repeating-linear-gradient(-45deg, var(--hl) 0 10px, #1a1a1a 10px 20px); }
.banner-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.err-code { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: .02em; color: var(--crit); }
.banner.warn .err-code { color: var(--warn); }
.err-title { font-weight: 700; font-size: 18px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }

/* checklist */
.progress { display: flex; align-items: center; gap: 12px; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.step { position: relative; }
.step input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.step-box { display: grid; grid-template-columns: 44px 1fr 28px; gap: 12px; align-items: center; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); min-height: 72px; }
.step-ico { width: 44px; height: 44px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.step-n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); font-weight: 600; letter-spacing: .06em; }
.step-t { font-weight: 700; line-height: 1.35; }
.step-d { font-size: 13px; color: var(--ink-2); }
.tick { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--ink-2); display: grid; place-items: center; color: transparent; }
.tick .svg { width: 18px; height: 18px; stroke-width: 3; }
.step input:checked + .step-box { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); }
.step input:checked + .step-box .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.step input:checked + .step-box .step-t { text-decoration: line-through; text-decoration-color: var(--ink-2); }
.step input:focus-visible + .step-box { outline: 3px solid var(--accent); outline-offset: 2px; }

/* decision */
.decide { display: grid; grid-template-columns: 1fr; gap: 10px; }
.big { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--surface); cursor: pointer; text-align: left; min-height: 84px; width: 100%; }
.big:hover { background: var(--bg); }
.big b { font-size: 17px; display: flex; align-items: center; gap: 10px; }
.big span { font-size: 13px; color: var(--ink-2); }
.big.pick { background: var(--ink); color: var(--bg); }
.big.pick span { color: color-mix(in srgb, var(--bg) 75%, var(--ink)); }
.big.fix b .svg { color: var(--ok); }
.big.esc b .svg { color: var(--crit); }
.big.pick b .svg { color: var(--hl); }

/* resources */
.res { display: flex; flex-direction: column; }
.res-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.res-row:first-child { border-top: 0; }
.res-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.res-code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.loc { font-family: var(--font-mono); font-weight: 600; font-size: 14px; background: var(--hl); color: var(--hl-ink); padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.res-end { display: flex; align-items: center; gap: 8px; grid-row: 1 / span 2; grid-column: 2; flex-wrap: wrap; justify-content: flex-end; }
.map { display: grid; gap: 4px; }
.map-row { display: grid; grid-template-columns: 22px repeat(8, 1fr); gap: 4px; align-items: center; }
.map-lab { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); text-align: center; }
.cell { height: 28px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.cell.on { background: var(--hl); border-color: #8a6d00; }
.lockers { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.lk { height: 38px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--ink-2); }
.lk.on { background: var(--hl); border-color: #8a6d00; color: var(--hl-ink); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; background: var(--hl); border: 1px solid #8a6d00; margin-right: 6px; vertical-align: -1px; }
.sub-h { font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }

/* contact */
.contact { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1.5px solid var(--ink); border-radius: 8px; }
.who { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.num { font-family: var(--font-mono); font-size: 22px; font-weight: 600; letter-spacing: .02em; user-select: all; }
.note { font-size: 12.5px; color: var(--ink-2); }

/* seg */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1.5px solid var(--line); border-radius: 6px; font-weight: 700; background: var(--bg); text-align: center; padding: 0 8px; }
.seg input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* history */
.log { display: flex; flex-direction: column; }
.log-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.log-item:first-child { border-top: 0; }
.log-memo { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.empty { padding: 24px 8px; text-align: center; color: var(--ink-2); }

/* QR */
.qr-label { background: #fff; color: #111; border: 2px solid #111; border-radius: 6px; padding: 18px; display: grid; gap: 14px; justify-items: center; width: min(100%, 340px); margin-inline: auto; }
.qr-label .hz { height: 8px; width: 100%; background: repeating-linear-gradient(-45deg, #ffcf33 0 10px, #1a1a1a 10px 20px); }
.qr-label svg { width: 100%; max-width: 260px; height: auto; display: block; }
.qr-label .qid { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .04em; line-height: 1; }
.qr-label .qname { font-size: 14px; font-weight: 700; text-align: center; }
.qr-label .qhint { font-size: 11px; color: #444; text-align: center; font-family: var(--font-mono); letter-spacing: .04em; }
.urlbox { font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.quick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* roadmap */
.road { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 720px) { .road { grid-template-columns: repeat(3, 1fr); } }
.road div { border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
.road b { display: block; color: var(--ink); font-size: 14px; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in-tabs { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 12px; font-weight: 700; text-decoration: none; color: var(--ink-2); }
.tab[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--accent); }
.tab[aria-current="page"] .svg { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.foot { font-size: 12px; color: var(--ink-2); padding-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  return '[설비 지원 요청]\n장비ID: ' + e.id + ' (' + e.name + ')\n에러코드: ' + e.code + ' ' + e.title + '\n위치: ' + e.place +
    '\n조치 진행: ' + n + '/' + e.steps.length + '단계\n필요 부품: ' + need + '\n현장 조치가 어려워 지원 부탁드립니다.';
}

function renderZone(e) {
  var z = document.getElementById('zone'); if (!z) return;
  var d = decision[e.id];
  var html = '<section class="card" aria-labelledby="h-dec"><h2 id="h-dec">2 · 현장에서 해결할 수 있나요?</h2><div class="decide">' +
    '<button type="button" class="big fix' + (d === 'fix' ? ' pick' : '') + '" data-decide="fix"><b>' + ico('check') + '현장 조치 가능</b><span>조치 완료 내용을 기록합니다.</span></button>' +
    '<button type="button" class="big esc' + (d === 'esc' ? ' pick' : '') + '" data-decide="esc"><b>' + ico('phone') + '현장 조치 불가</b><span>필요한 부품·공구 위치를 보고 담당자에게 연락합니다.</span></button></div></section>';

  if (d === 'esc') {
    var parts = e.parts.map(function (p) {
      return '<div class="res-row"><div><div class="res-name">' + esc(p.n) + '</div><div class="res-code">' + esc(p.c) + '</div></div>' +
        '<div class="res-end">' + (p.q > 0 ? '<span class="chip ok tnum">재고 ' + p.q + '</span>' : '<span class="chip crit">재고 없음</span>') + '<span class="loc">' + p.r + '</span></div></div>';
    }).join('');
    var tools = e.tools.map(function (t) {
      return '<div class="res-row"><div class="res-name">' + esc(t.n) + '</div><div class="res-end"><span class="loc">락커 ' + (t.l < 10 ? '0' + t.l : t.l) + '</span></div></div>';
    }).join('');
    var soldout = e.parts.some(function (p) { return p.q === 0; });
    html += '<section class="card" aria-labelledby="h-res"><h2 id="h-res">3 · 필요한 부품과 공구</h2>' +
      '<div class="sub-h">교체 부품</div><div class="res">' + parts + '</div>' +
      (soldout ? '<p class="note">재고가 없는 부품은 담당자에게 긴급 발주를 요청하세요.</p>' : '') +
      '<div class="sub-h">수리 공구</div><div class="res">' + tools + '</div>' + mapHtml(e) + '</section>' +
      '<section class="card" aria-labelledby="h-call"><h2 id="h-call">4 · 담당자 연결</h2><div class="contact">' +
        '<div class="who"><div><div style="font-weight:700">' + esc(e.eng.n) + '</div><div class="sub">' + esc(e.eng.r) + '</div></div>' +
        '<div class="num" id="phone-num">' + e.eng.p + '</div></div>' +
        '<div class="btn-row"><a class="btn primary" href="tel:' + e.eng.p.replace(/-/g, '') + '">' + ico('phone') + '전화 연결</a>' +
        '<button class="btn" type="button" data-copy="' + e.eng.p + '">' + ico('copy') + '번호 복사</button></div></div>' +
        '<label class="f" for="sms-body">문자 문구 (자동 작성, 수정 가능)<textarea class="in" id="sms-body" rows="7">' + esc(smsText(e)) + '</textarea></label>' +
        '<div class="btn-row"><a class="btn" id="sms-link" href="sms:' + e.eng.p.replace(/-/g, '') + '?&body=' + encodeURIComponent(smsText(e)) + '">' + ico('msg') + '문자 앱 열기</a>' +
        '<button class="btn" type="button" id="sms-copy">' + ico('copy') + '문구 복사</button></div>' +
        '<p class="note">전화·문자 앱은 기기와 브라우저에 따라 열리지 않을 수 있습니다. 그럴 때는 번호와 문구를 복사해서 사용하세요.</p></section>';
  }
  if (d === 'fix' || d === 'esc') {
    var isEsc = d === 'esc';
    html += '<section class="card" aria-labelledby="h-form"><h2 id="h-form">' + (isEsc ? '5' : '3') + ' · ' + (isEsc ? '외주 요청 기록' : '조치 완료 기록') + '</h2>' +
      '<form id="log-form" novalidate style="display:flex;flex-direction:column;gap:14px">' +
      '<div class="seg" role="radiogroup" aria-label="처리 구분"><label><input type="radio" name="kind" value="done"' + (isEsc ? '' : ' checked') + '><span>조치 완료</span></label>' +
      '<label><input type="radio" name="kind" value="outsource"' + (isEsc ? ' checked' : '') + '><span>외주 요청</span></label></div>' +
      '<div class="row2"><label class="f" for="who">작업자 이름<input class="in" id="who" name="who" autocomplete="name" maxlength="20" placeholder="예: 김현장"></label>' +
      '<label class="f" for="min">소요 시간(분)<input class="in tnum" id="min" name="min" type="number" inputmode="numeric" min="0" max="999" placeholder="예: 25"></label></div>' +
      '<label class="f" for="memo">조치 내용 · 메모<textarea class="in" id="memo" name="memo" maxlength="400" placeholder="' + (isEsc ? '예: 메커니컬 씰 누수. 부품 재고 없음.' : '예: 스트레이너 청소 후 압력 정상 확인.') + '"></textarea></label>' +
      '<div class="err" id="form-err" role="alert"></div>' +
      '<button class="btn primary block" type="submit">' + ico('check') + '기록 제출</button></form></section>';
  }
  if (d === 'done') {
    html = '<section class="card"><h2>기록이 저장되었습니다</h2><p class="lead">' + e.id + ' · ' + esc(e.code) + ' 조치 내역이 이력에 추가되었습니다.</p>' +
      '<div class="btn-row"><a class="btn primary" href="#history">조치 이력 보기</a><a class="btn" href="#home">다른 설비 스캔</a></div></section>';
  }
  z.innerHTML = html;
}

function viewHistory() {
  setNav('history');
  document.getElementById('crumb').innerHTML = '';
  var all = userLog.concat(SAMPLE).sort(function (a, b) { return b.t - a.t; });
  var items = all.map(function (l) {
    var e = find(l.id);
    return '<div class="log-item"><div><div class="res-name"><span class="mono">' + esc(l.id) + '</span> ' + esc(e ? e.name : '') + '</div>' +
      '<div class="sub">' + esc(l.code) + ' · ' + fmt(l.t) + ' · ' + esc(l.who || '-') + (l.min ? ' · ' + esc(l.min) + '분' : '') + (l.sample ? ' · 샘플' : '') + '</div></div>' + kindChip(l.kind) +
      (l.memo ? '<div class="log-memo">' + esc(l.memo) + '</div>' : '') + '</div>';
  }).join('');
  $app.innerHTML = '<div><div class="eyebrow">제출된 기록</div><h1 class="h-page">조치 이력</h1><p class="lead" style="margin-top:10px">조치 완료와 외주 요청이 시간순으로 쌓입니다. 이 화면의 기록은 현재 브라우저에만 저장됩니다.</p></div>' +
    '<section class="card"><div class="log">' + items + '</div></section>';
}

function qrSvg(text) {
  var qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  var n = qr.getModuleCount(), m = 2, d = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  var s = n + m * 2;
  return '<svg viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
var baseUrl = 'https://kevin9480.github.io/HINT/';
function qrUrl(id) { return baseUrl.split('#')[0] + '#' + id.toLowerCase(); }

function viewQr() {
  setNav('qr');
  document.getElementById('crumb').innerHTML = '';
  $app.innerHTML = '<div><div class="eyebrow">시연 · 운영</div><h1 class="h-page">설비 QR 생성</h1><p class="lead" style="margin-top:10px">설비 ID를 입력하면 QR이 바로 만들어집니다. 스캔하면 이 앱의 해당 설비 화면이 열립니다.</p></div>' +
    '<div class="cols"><section class="card" aria-labelledby="h-qin"><h2 id="h-qin">설비 ID</h2>' +
      '<label class="f" for="qr-id">장비 ID (영문, 숫자, 하이픈)<input class="in mono" id="qr-id" value="' + esc(qrId) + '" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>' +
      '<div class="err" id="qr-err" role="alert"></div>' +
      '<div class="sub-h">등록된 설비</div><div class="quick" id="quick">' + EQ.map(function (e) { return '<button type="button" data-qid="' + e.id + '" aria-pressed="' + (e.id === qrId) + '">' + e.id + '</button>'; }).join('') + '</div>' +
      '<label class="f" for="qr-base">앱 주소 (QR이 열 페이지)<input class="in" id="qr-base" value="' + esc(baseUrl) + '" autocomplete="off" spellcheck="false" style="text-transform:none;font-size:13px"></label>' +
      '<div class="sub-h">QR에 담기는 주소</div><div class="urlbox" id="qr-url"></div>' +
      '<div class="btn-row"><button class="btn" type="button" id="qr-copy">' + ico('copy') + '주소 복사</button><a class="btn" id="qr-open" href="#">' + ico('go') + '설비 화면 열기</a></div>' +
      '<p class="note">게시된 링크는 공유 설정을 한 사람만 열 수 있습니다. 시연 휴대폰에서 같은 계정으로 로그인하거나 공유를 켜 두세요. 직접 호스팅하면 위 주소를 실제 서비스 주소로 바꾸면 됩니다.</p></section>' +
    '<section class="card" aria-labelledby="h-qout"><h2 id="h-qout">부착용 라벨 미리보기</h2><div id="qr-out"></div></section></div>';
  drawQr();
}
function drawQr() {
  var v = (document.getElementById('qr-id').value || '').trim();
  var err = document.getElementById('qr-err'), out = document.getElementById('qr-out');
  if (!v) { err.textContent = '설비 ID를 입력하세요.'; out.innerHTML = '<p class="empty">ID를 입력하면 QR이 여기에 표시됩니다.</p>'; return; }
  if (!/^[A-Za-z0-9-]{1,20}$/.test(v)) { err.textContent = '영문, 숫자, 하이픈만 사용할 수 있습니다.'; return; }
  qrId = v.toUpperCase();
  var e = find(qrId);
  err.textContent = e ? '' : '등록되지 않은 ID입니다. 스캔하면 홈 화면으로 이동합니다.';
  var url = qrUrl(qrId);
  document.getElementById('qr-url').textContent = url;
  document.getElementById('qr-open').setAttribute('href', '#' + qrId.toLowerCase());
  out.innerHTML = '<div class="qr-label"><div class="hz"></div>' + qrSvg(url) + '<div class="qid">' + esc(qrId) + '</div>' +
    '<div class="qname">' + esc(e ? e.name : '신규 설비') + '</div><div class="qhint">SCAN FOR ERROR GUIDE</div><div class="hz"></div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-qid') === qrId)); });
}

/* ---------- router ---------- */
function route() {
  stopCam();
  var h = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
  if (h === 'history') viewHistory();
  else if (h === 'qr') viewQr();
  else if (h && h !== 'home' && find(h)) viewEq(find(h));
  else { viewHome(); if (h && h !== 'home') { var s = document.getElementById('serial-err'); if (s) s.textContent = '등록되지 않은 설비입니다: ' + h.toUpperCase(); } }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------- scanning ---------- */
var stream = null, raf = 0;
function stopCam() {
  cancelAnimationFrame(raf);
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  var c = document.getElementById('cam'); if (c) c.hidden = true;
}
function handleDecoded(text) {
  var raw = String(text || '').trim(), id = raw.indexOf('#') >= 0 ? raw.split('#').pop() : raw;
  if (find(id)) { location.hash = '#' + id.toLowerCase(); return true; }
  var err = document.getElementById('scan-err');
  if (err) err.textContent = '등록되지 않은 QR입니다. 설비 시리얼 번호를 직접 입력해 보세요.';
  return false;
}
function startCam() {
  var err = document.getElementById('scan-err'); err.textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { err.textContent = '이 브라우저에서는 카메라를 열 수 없습니다. 아래 사진 촬영 버튼을 사용하세요.'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
    stream = s;
    var v = document.getElementById('vid'); v.srcObject = s; v.play();
    document.getElementById('cam').hidden = false;
    var cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    (function tick() {
      if (!stream) return;
      if (v.readyState >= 2 && v.videoWidth) {
        var w = 640, h = Math.round(640 * v.videoHeight / v.videoWidth); cv.width = w; cv.height = h;
        ctx.drawImage(v, 0, 0, w, h);
        var r = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
        if (r && r.data) { if (handleDecoded(r.data)) { stopCam(); return; } }
      }
      raf = requestAnimationFrame(tick);
    })();
  }).catch(function () {
    err.textContent = '카메라 권한이 없거나 이 화면에서는 사용할 수 없습니다. 아래 사진 촬영 버튼으로 QR을 읽을 수 있습니다.';
  });
}
function scanFile(file) {
  var err = document.getElementById('scan-err'); err.textContent = '';
  if (!file) return;
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    var ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    var r = window.jsQR && jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'attemptBoth' });
    if (r && r.data) handleDecoded(r.data); else err.textContent = 'QR을 찾지 못했습니다. QR이 화면에 크게 나오도록 다시 촬영하거나 시리얼 번호를 입력하세요.';
  };
  img.onerror = function () { err.textContent = '이미지를 읽지 못했습니다. 다른 사진을 선택하세요.'; };
  img.src = url;
}

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button, a'); if (!t) return;
  if (t.id === 'btn-cam') return startCam();
  if (t.id === 'btn-cam-stop') return stopCam();
  var h = location.hash.replace(/^#/, '').toLowerCase(), e = find(h);
  if (t.hasAttribute('data-decide') && e) { decision[e.id] = t.getAttribute('data-decide'); renderZone(e); return; }
  if (t.hasAttribute('data-copy')) { copy(t.getAttribute('data-copy'), function (ok) { toast(ok ? '복사했습니다' : '복사하지 못했습니다. 번호를 길게 눌러 선택하세요'); }); return; }
  if (t.id === 'sms-copy') { copy(document.getElementById('sms-body').value, function (ok) { toast(ok ? '문구를 복사했습니다' : '복사하지 못했습니다. 문구를 직접 선택하세요'); }); return; }
  if (t.id === 'qr-copy') { copy(document.getElementById('qr-url').textContent, function (ok) { toast(ok ? '주소를 복사했습니다' : '복사하지 못했습니다'); }); return; }
  if (t.hasAttribute('data-qid')) { document.getElementById('qr-id').value = t.getAttribute('data-qid'); drawQr(); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'file-qr') { scanFile(t.files && t.files[0]); t.value = ''; return; }
  if (t.hasAttribute && t.hasAttribute('data-step')) {
    var e = find(location.hash.replace(/^#/, '')); if (!e) return;
    checked[e.id] = checked[e.id] || {}; checked[e.id][t.getAttribute('data-step')] = t.checked; updateProgress(e);
    var sb = document.getElementById('sms-body'), sl = document.getElementById('sms-link');
    if (sb) { sb.value = smsText(e); sl.setAttribute('href', 'sms:' + e.eng.p.replace(/-/g, '') + '?&body=' + encodeURIComponent(sb.value)); }
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'qr-id') drawQr();
  if (t.id === 'qr-base') { baseUrl = t.value.trim() || baseUrl; drawQr(); }
  if (t.id === 'sms-body') { var e = find(location.hash.replace(/^#/, '')); if (e) document.getElementById('sms-link').setAttribute('href', 'sms:' + e.eng.p.replace(/-/g, '') + '?&body=' + encodeURIComponent(t.value)); }
});
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.id === 'serial-form') {
    var v = document.getElementById('serial').value.trim(), err = document.getElementById('serial-err');
    if (!v) { err.textContent = '시리얼 번호를 입력하세요.'; return; }
    if (!find(v)) { err.textContent = '등록된 설비가 없습니다. 예: PMP-0231, CNV-0107'; return; }
    location.hash = '#' + v.toLowerCase();
  }
  if (f.id === 'log-form') {
    var e = find(location.hash.replace(/^#/, '')); if (!e) return;
    var who = f.who.value.trim(), err2 = document.getElementById('form-err');
    if (!who) { err2.textContent = '작업자 이름을 입력하세요.'; f.who.focus(); return; }
    userLog.unshift({ t: Date.now(), id: e.id, code: e.code, kind: f.kind.value, who: who, min: f.min.value ? Number(f.min.value) : 0, memo: f.memo.value.trim() });
    saveLog(); decision[e.id] = 'done'; renderZone(e); toast('기록이 저장되었습니다');
  }
});

route();
})();
</script>
